<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Treasure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    height: 100vh; overflow: hidden;
    padding: 10px 34px 38px 18px;
    display: grid; grid-template-rows: auto 1fr; gap: 12px;
    font-family: "IM Fell English SC", Georgia, serif;
    color: #f3e2b8;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,180,80,.16), transparent 50%),
      linear-gradient(#07121a, #0b2230 70%, #0a1c27);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    box-shadow: inset 0 0 160px rgba(0,0,0,.8);
  }

  /* ================= HEADER ================= */
  header { display: flex; align-items: center; justify-content: center; gap: 22px; position: relative; }

  .sign {
    position: relative; padding: 10px 48px 12px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 9px),
      linear-gradient(#6b4423, #4b2d15);
    border-radius: 10px;
    box-shadow:
      inset 0 0 0 4px #2b190a, inset 0 0 0 7px #8a6a3a, inset 0 0 0 9px #2b190a,
      inset 0 0 40px rgba(0,0,0,.6), 0 10px 24px rgba(0,0,0,.7);
    animation: sway 6s ease-in-out infinite; transform-origin: 50% -40px;
  }
  @keyframes sway { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(.8deg); } }
  .sign h1 {
    margin: 0; white-space: nowrap;
    font-family: "Pirata One", "IM Fell English SC", serif; font-weight: 400;
    font-size: clamp(22px, 3.3vw, 46px); letter-spacing: 1.5px; line-height: 1.05;
    background: linear-gradient(#fff3b0, #f2c240 45%, #b37a12 70%, #ffe27a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 #2b190a) drop-shadow(0 0 10px rgba(255,190,60,.35));
  }
  .nail {
    position: absolute; top: 50%; width: 13px; height: 13px; margin-top: -6.5px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f6e2a0, #9c7a2e 60%, #4a3510);
    box-shadow: 0 2px 2px rgba(0,0,0,.6);
  }
  .nail.l { left: 16px; } .nail.r { right: 16px; }

  .lantern {
    position: relative; width: 24px; height: 38px; border-radius: 6px 6px 10px 10px; flex: none;
    background: radial-gradient(circle at 50% 60%, #fff4c0, #ffb238 45%, #a04c00 90%);
    box-shadow: 0 0 0 3px #2a1a08, 0 0 30px 12px rgba(255,170,50,.45);
    animation: flicker 2.6s infinite;
  }
  .lantern::before { content:""; position:absolute; left:50%; top:-13px; width:12px; height:12px; margin-left:-6px;
    border: 3px solid #2a1a08; border-bottom: 0; border-radius: 8px 8px 0 0; }
  .lantern.r { animation-delay: -1.3s; }
  @keyframes flicker {
    0%,100% { box-shadow: 0 0 0 3px #2a1a08, 0 0 30px 12px rgba(255,170,50,.45); }
    40%     { box-shadow: 0 0 0 3px #2a1a08, 0 0 22px 8px  rgba(255,150,40,.35); }
    60%     { box-shadow: 0 0 0 3px #2a1a08, 0 0 36px 14px rgba(255,185,70,.5); }
  }

  .flag { width: 78px; height: 74px; flex: none; }
  .flag .cloth { transform-origin: 8px 10px; animation: wave 2.4s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-5deg) scaleX(.94); } }
  .swords { width: 82px; height: 74px; flex: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,.7)); }

  /* ================= MAIN ================= */
  .main { display: flex; gap: 18px; min-height: 0; }

  /* --- mast with coins --- */
  .mast {
    position: relative; flex: none; width: 112px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    border-radius: 14px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 2px, transparent 2px 36px),
      linear-gradient(90deg, #4a2c14, #6a4322 50%, #4a2c14);
    box-shadow: inset 0 0 0 3px #24140a, inset 0 0 0 6px #7a5630, inset 0 0 0 8px #24140a,
                inset 0 0 30px rgba(0,0,0,.6), 0 16px 34px rgba(0,0,0,.8);
  }
  .mast::before, .mast::after { /* rope bindings */
    content: ""; position: absolute; left: -4px; right: -4px; height: 22px; border-radius: 6px;
    background: repeating-linear-gradient(60deg, #d6b47a 0 5px, #a07c45 5px 9px, #6e532a 9px 11px);
    box-shadow: 0 0 0 2px #2b190a, 0 4px 8px rgba(0,0,0,.6);
  }
  .mast::before { top: 26px; } .mast::after { bottom: 26px; }

  .coin {
    --size: 82px;
    position: relative; width: var(--size); height: var(--size); flex: none;
    border: 0; padding: 0; border-radius: 50%; cursor: pointer;
    background: repeating-conic-gradient(#8a5c06 0 4deg, #e0ac2c 4deg 8deg);
    box-shadow: 0 6px 0 #5a3a02, 0 12px 22px rgba(0,0,0,.7);
    transition: transform .15s;
  }
  .coin::after {
    content: ""; position: absolute; inset: 6px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #fff8cf 0 6%, #ffd94e 24%, #e0a823 52%, #a8710b 82%, #7d5200);
    box-shadow: inset 0 0 0 3px #b8860b, inset 0 0 0 5px #ffe27a, inset 0 -6px 12px rgba(90,50,0,.55);
  }
  .coin svg {
    position: absolute; inset: 0; margin: auto; width: 48%; height: 48%; z-index: 1;
    fill: none; stroke: #6a4100; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 1px 0 #fff2a8);
  }
  .coin:hover:not(:disabled) { animation: flip .7s ease-in-out; }
  .coin:active:not(:disabled) { transform: translateY(4px); }
  @keyframes flip { 0% { transform: rotateY(0); } 50% { transform: rotateY(180deg) scale(1.08); } 100% { transform: rotateY(360deg); } }
  .coin.lit { box-shadow: 0 6px 0 #5a3a02, 0 0 26px 8px rgba(255,210,80,.65); }
  .coin.lit::before {
    content: "✔"; position: absolute; right: -4px; top: -4px; z-index: 2;
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font: 700 15px/1 system-ui; color: #fff; background: #2e8b3e; box-shadow: 0 0 0 3px #12331a;
  }
  .coin:disabled { cursor: default; filter: grayscale(.85) brightness(.6); }
  .coin.small { --size: 60px; }

  /* --- wooden frame --- */
  .frame {
    position: relative; flex: 1; min-width: 0; padding: 26px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 2px, transparent 2px 70px),
      repeating-linear-gradient(0deg, rgba(255,220,160,.04) 0 1px, transparent 1px 5px),
      linear-gradient(135deg, #6a4322, #4a2c14 50%, #5c3a1c);
    border-radius: 16px;
    box-shadow:
      inset 0 0 0 4px #24140a, inset 0 0 0 7px #7a5630, inset 0 0 0 9px #24140a,
      inset 0 0 50px rgba(0,0,0,.65), 0 20px 46px rgba(0,0,0,.85);
  }
  .rivet {
    position: absolute; width: 16px; height: 16px; border-radius: 50%; z-index: 4;
    background: radial-gradient(circle at 35% 30%, #fff0b8, #c99a3a 45%, #6b4a14 85%);
    box-shadow: 0 2px 3px rgba(0,0,0,.7);
  }
  .rivet.tl { top: 6px; left: 6px; } .rivet.tr { top: 6px; right: 6px; }
  .rivet.bl { bottom: 6px; left: 6px; } .rivet.br { bottom: 6px; right: 6px; }

  .rope {
    height: 100%; padding: 10px; border-radius: 10px;
    background: repeating-linear-gradient(45deg, #d6b47a 0 5px, #a07c45 5px 9px, #6e532a 9px 11px);
    box-shadow: 0 0 0 2px #2b190a, inset 0 0 0 2px #2b190a, 0 0 18px rgba(0,0,0,.7);
  }
  .stage {
    position: relative; width: 100%; height: 100%;
    border-radius: 4px; overflow: hidden;
    background: radial-gradient(ellipse at center, #123444, #061118);
    box-shadow: inset 0 0 0 3px #2b190a;
  }
  .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 90px rgba(30,10,0,.75);
    background: linear-gradient(rgba(255,190,110,.06), rgba(80,40,0,.08));
  }
  video, canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1);
  }
  canvas { pointer-events: none; }
  .placeholder {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: "Pirata One", serif; font-size: 34px; color: rgba(243,226,184,.45);
  }

  #status {
    position: absolute; top: 16px; right: 16px; z-index: 3;
    padding: 6px 18px 8px; border-radius: 6px;
    font-family: "Pirata One", serif; font-size: 28px; letter-spacing: 1px;
    background: linear-gradient(#5a381b, #3e2510);
    box-shadow: inset 0 0 0 2px #1d1007, inset 0 0 0 4px #7a5630, 0 6px 12px rgba(0,0,0,.6);
    color: #ff6a4d; text-shadow: 0 0 10px rgba(255,80,50,.8);
    transition: color .3s, text-shadow .3s;
  }
  #status.on { color: #8dff7a; text-shadow: 0 0 12px rgba(120,255,100,.9); }

  /* message ribbon */
  #msg {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 3;
    max-width: 70%; padding: 6px 22px; border-radius: 4px; text-align: center;
    font-size: 17px; color: #3b2410;
    background: #e9d6a8; box-shadow: inset 0 0 18px rgba(110,60,10,.5), 0 6px 14px rgba(0,0,0,.6);
    transition: opacity .6s;
  }
  #msg.hide { opacity: 0; }

  /* --- decorations on the frame --- */
  .deco { position: absolute; z-index: 5; pointer-events: none; filter: drop-shadow(0 6px 8px rgba(0,0,0,.75)); }
  .wheel { width: 140px; height: 140px; right: -30px; bottom: -34px; animation: spin 40s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chest { width: 120px; left: -20px; bottom: -30px; }
  .anchor { width: 54px; right: -30px; top: 70px; transform-origin: 50% 0; animation: swing 5s ease-in-out infinite; }
  @keyframes swing { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-4deg); } }
  .compass-rose { width: 90px; left: 50%; margin-left: -45px; top: -40px; }

  /* --- settings map popover --- */
  #map {
    position: absolute; left: 30px; top: 50%; transform: translateY(-50%); z-index: 6;
    width: 280px; padding: 22px 24px 18px; border-radius: 6px;
    color: #3b2410;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(120,70,20,.2), transparent 50%),
      radial-gradient(ellipse at 80% 75%, rgba(120,70,20,.18), transparent 50%),
      #e9d6a8;
    box-shadow: inset 0 0 30px rgba(110,60,10,.6), 0 12px 28px rgba(0,0,0,.7);
    display: none;
  }
  #map.open { display: block; }
  #map h2 { margin: 0 0 10px; font-family: "Pirata One", serif; font-weight: 400; font-size: 26px; text-align: center; }
  #map label { display: flex; justify-content: space-between; font-size: 16px; margin-top: 8px; }
  #map label span { font-family: Consolas, monospace; font-size: 13px; }
  #map input { width: 100%; accent-color: #8a5a10; }
  #values { margin-top: 10px; font-family: Consolas, monospace; font-size: 11px; color: #6b4a22; text-align: center; }
  #map .x { position: absolute; right: 14px; bottom: 8px; font-family: "Pirata One", serif; font-size: 30px; color: #a3261b; opacity: .8; }
</style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header>
  <svg class="flag" viewBox="0 0 80 76" aria-hidden="true">
    <rect x="4" y="4" width="5" height="70" rx="2" fill="#5a3a1a"/>
    <circle cx="6.5" cy="4" r="4" fill="#d9ad52"/>
    <g class="cloth">
      <path d="M9 8 Q40 2 76 10 L72 46 Q40 40 9 46 Z" fill="#141414" stroke="#000" stroke-width="1"/>
      <g fill="#e9dcc0" transform="translate(41 26)">
        <path d="M0-12c-6 0-10 4-10 9 0 3 1.6 5.2 3.6 6.4V7h12.8V3.4C8.4 2.2 10 0 10-3c0-5-4-9-10-9z"/>
        <circle cx="-4" cy="-3" r="2.4" fill="#141414"/><circle cx="4" cy="-3" r="2.4" fill="#141414"/>
        <path d="M-14 9l28 7M14 9l-28 7" stroke="#e9dcc0" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
  </svg>
  <span class="lantern l"></span>
  <div class="sign">
    <span class="nail l"></span><span class="nail r"></span>
    <h1>You will never find out what the treasure is</h1>
  </div>
  <span class="lantern r"></span>
  <svg class="swords" viewBox="0 0 84 76" aria-hidden="true">
    <g stroke-linecap="round">
      <path d="M14 66 Q40 40 72 8" stroke="#cfd6dc" stroke-width="6" fill="none"/>
      <path d="M70 66 Q44 40 12 8" stroke="#cfd6dc" stroke-width="6" fill="none"/>
      <path d="M20 54 l12 12" stroke="#c99a3a" stroke-width="5"/>
      <path d="M64 54 l-12 12" stroke="#c99a3a" stroke-width="5"/>
      <path d="M14 66 l-8 8" stroke="#4a2c14" stroke-width="6"/>
      <path d="M70 66 l8 8" stroke="#4a2c14" stroke-width="6"/>
    </g>
  </svg>
</header>

<!-- ================= MAIN ================= -->
<div class="main">
  <div class="mast">
    <button id="btnCamera" class="coin" title="Start camera" aria-label="Start camera">
      <svg viewBox="0 0 24 24"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.3l1.4-2h7.6l1.4 2h2.3A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>
    </button>
    <button id="btnSerial" class="coin" title="Connect Arduino" aria-label="Connect Arduino">
      <svg viewBox="0 0 24 24"><path d="M9 2v5M15 2v5"/><path d="M6.5 7h11v4a5.5 5.5 0 0 1-11 0z"/><path d="M12 16.5V22"/></svg>
    </button>
    <button id="btnTestOn" class="coin small" title="Test: move servo" aria-label="Test: move servo" disabled>
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
    </button>
    <button id="btnTestOff" class="coin small" title="Test: return servo" aria-label="Test: return servo" disabled>
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
    </button>
    <button id="btnMap" class="coin small" title="Sensitivity settings" aria-label="Sensitivity settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
    </button>
  </div>

  <div class="frame">
    <span class="rivet tl"></span><span class="rivet tr"></span>
    <span class="rivet bl"></span><span class="rivet br"></span>

    <!-- compass rose on top edge -->
    <svg class="deco compass-rose" viewBox="-50 -50 100 100" aria-hidden="true">
      <circle r="40" fill="#e9d6a8" stroke="#5a3a14" stroke-width="4"/>
      <circle r="32" fill="none" stroke="#8a6a3a" stroke-width="1.5" stroke-dasharray="3 3"/>
      <path d="M0-36 L6-6 0 0 -6-6Z M0 36 L6 6 0 0 -6 6Z" fill="#5a3a14"/>
      <path d="M-36 0 L-6 6 0 0 -6-6Z M36 0 L6 6 0 0 6-6Z" fill="#a07c45"/>
      <path d="M0-36 L6-6 0 0Z" fill="#a3261b"/>
      <circle r="4" fill="#c99a3a" stroke="#5a3a14" stroke-width="1.5"/>
    </svg>

    <!-- anchor -->
    <svg class="deco anchor" viewBox="0 0 60 96" aria-hidden="true">
      <g fill="none" stroke="#3a3f44" stroke-width="6" stroke-linecap="round">
        <circle cx="30" cy="10" r="6"/>
        <path d="M30 16v66M16 28h28"/>
        <path d="M7 60q4 24 23 24t23-24"/>
      </g>
      <path d="M2 62l9-8 2 12zM58 62l-9-8-2 12z" fill="#3a3f44"/>
      <g fill="none" stroke="#8d969e" stroke-width="2" stroke-linecap="round" opacity=".7">
        <path d="M28 18v60M18 26h10"/>
      </g>
    </svg>

    <!-- treasure chest (locked) -->
    <svg class="deco chest" viewBox="0 0 130 104" aria-hidden="true">
      <path d="M10 44 Q10 10 65 10 Q120 10 120 44Z" fill="#6b3f1c" stroke="#24140a" stroke-width="4"/>
      <rect x="10" y="44" width="110" height="54" rx="4" fill="#5a3418" stroke="#24140a" stroke-width="4"/>
      <path d="M10 64h110" stroke="#24140a" stroke-width="2" opacity=".5"/>
      <g fill="#c99a3a" stroke="#6b4a14" stroke-width="2">
        <path d="M24 12 Q22 28 24 44 v54 h12 v-54 Q34 28 36 11Z"/>
        <path d="M94 11 Q96 28 94 44 v54 h12 v-54 Q108 28 106 12Z"/>
        <rect x="54" y="36" width="22" height="28" rx="3"/>
      </g>
      <circle cx="65" cy="47" r="4" fill="#24140a"/><path d="M63 49h4l1 9h-6z" fill="#24140a"/>
      <g fill="#ffe27a"><circle cx="8" cy="98" r="6"/><circle cx="18" cy="100" r="5"/><circle cx="122" cy="99" r="6"/></g>
    </svg>

    <!-- ship's wheel -->
    <svg class="deco wheel" viewBox="-60 -60 120 120" aria-hidden="true">
      <defs>
        <g id="spoke">
          <line x1="0" y1="-12" x2="0" y2="-38" stroke="#6b4423" stroke-width="5"/>
          <line x1="0" y1="-42" x2="0" y2="-57" stroke="#7a4f28" stroke-width="8" stroke-linecap="round"/>
        </g>
      </defs>
      <use href="#spoke"/><use href="#spoke" transform="rotate(45)"/><use href="#spoke" transform="rotate(90)"/>
      <use href="#spoke" transform="rotate(135)"/><use href="#spoke" transform="rotate(180)"/><use href="#spoke" transform="rotate(225)"/>
      <use href="#spoke" transform="rotate(270)"/><use href="#spoke" transform="rotate(315)"/>
      <circle r="38" fill="none" stroke="#5a3418" stroke-width="9"/>
      <circle r="38" fill="none" stroke="#c99a3a" stroke-width="2"/>
      <circle r="12" fill="#5a3418" stroke="#c99a3a" stroke-width="3"/>
      <circle r="4" fill="#c99a3a"/>
    </svg>

    <div class="rope">
      <div class="stage">
        <div class="placeholder" id="placeholder">☠ press the camera coin ☠</div>
        <video id="video" autoplay playsinline muted></video>
        <audio id="music" src="music/theme.mp3" loop preload="auto"></audio>
        <canvas id="overlay"></canvas>
        <div id="status">NOT LOOKING</div>
        <div id="msg">Press the camera coin to begin</div>

        <div id="map">
          <h2>Ship's Settings</h2>
          <label>Head tolerance <span id="headTolVal">0.15</span></label>
          <input id="headTol" type="range" min="0.05" max="0.3" step="0.01" value="0.15">
          <label>Eye tolerance <span id="eyeTolVal">0.15</span></label>
          <input id="eyeTol" type="range" min="0.05" max="0.3" step="0.01" value="0.15">
          <div id="values"></div>
          <span class="x">X</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">

// ---------- settings ----------
const FRAMES_TO_ON  = 5;   // consecutive "looking" frames to trigger
const FRAMES_TO_OFF = 10;  // consecutive "not looking" frames to release
// ------------------------------

const video     = document.getElementById("video");
const canvas    = document.getElementById("overlay");
const ctx       = canvas.getContext("2d");
const statusEl  = document.getElementById("status");
const msgEl     = document.getElementById("msg");
const valuesEl  = document.getElementById("values");
const headTol   = document.getElementById("headTol");
const eyeTol    = document.getElementById("eyeTol");
const btnCamera = document.getElementById("btnCamera");
const btnSerial = document.getElementById("btnSerial");

headTol.oninput = () => document.getElementById("headTolVal").textContent = headTol.value;
eyeTol.oninput  = () => document.getElementById("eyeTolVal").textContent  = eyeTol.value;
document.getElementById("btnMap").onclick = () => document.getElementById("map").classList.toggle("open");

let msgTimer = null;
function say(text, sticky = false) {
  msgEl.textContent = text;
  msgEl.classList.remove("hide");
  clearTimeout(msgTimer);
  if (!sticky) msgTimer = setTimeout(() => msgEl.classList.add("hide"), 4000);
}

let faceLandmarker = null;
let writer = null;
let lookingState = false;
let onCount = 0, offCount = 0;
let lastVideoTime = -1;

// ---------- Arduino (Web Serial) ----------
btnSerial.onclick = async () => {
  if (writer) return;
  if (!("serial" in navigator)) {
    say("Web Serial not supported. Use Chrome or Edge on a computer.", true);
    return;
  }
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 9600 });
    writer = port.writable.getWriter();
    say("Arduino connected ✔");
    btnSerial.classList.add("lit");
    document.getElementById("btnTestOn").disabled = false;
    document.getElementById("btnTestOff").disabled = false;
    send(lookingState ? "1" : "0");
  } catch (e) {
    say("Connection failed: " + e.message + " (close the Serial Monitor in Arduino IDE)", true);
  }
};

async function send(cmd) {
  if (!writer) return;
  try {
    await writer.write(new TextEncoder().encode(cmd));
  } catch (e) {
    say("Send error: " + e.message, true);
  }
}

document.getElementById("btnTestOn").onclick  = () => send("1");
document.getElementById("btnTestOff").onclick = () => send("0");

// ---------- camera + MediaPipe ----------
btnCamera.onclick = async () => {
  if (faceLandmarker) return;
  try {
    say("Loading MediaPipe...", true);
    const { FaceLandmarker, FilesetResolver } = await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
    );
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    const fl = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU",
      },
      runningMode: "VIDEO",
      numFaces: 1,
    });

    say("Requesting camera...", true);
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 } },
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    faceLandmarker = fl;
    document.getElementById("placeholder").style.display = "none";
    btnCamera.classList.add("lit");
    say(writer ? "Camera ready" : "Camera ready — now connect the Arduino");
    updateMusic();   // nobody is looking yet -> music starts
    requestAnimationFrame(loop);
  } catch (e) {
    say("Error: " + e.message, true);
  }
};

function ratio(v, a, b) {
  return b === a ? 0.5 : (v - a) / (b - a);
}

function isLooking(lm) {
  const yaw   = ratio(lm[1].x, lm[234].x, lm[454].x);   // head left/right
  const pitch = ratio(lm[1].y, lm[10].y,  lm[152].y);   // head up/down
  const eye1  = ratio(lm[468].x, lm[33].x,  lm[133].x); // iris 1
  const eye2  = ratio(lm[473].x, lm[362].x, lm[263].x); // iris 2

  const ht = parseFloat(headTol.value);
  const et = parseFloat(eyeTol.value);
  const headOk = Math.abs(yaw - 0.5) < ht && pitch > 0.35 && pitch < 0.75;
  const eyesOk = Math.abs(eye1 - 0.5) < et && Math.abs(eye2 - 0.5) < et;
  return { looking: headOk && eyesOk, yaw, pitch, eye1, eye2 };
}

function loop() {
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = faceLandmarker.detectForVideo(video, performance.now());
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let lookingNow = false;
    if (res.faceLandmarks && res.faceLandmarks.length) {
      const lm = res.faceLandmarks[0];
      const r = isLooking(lm);
      lookingNow = r.looking;
      valuesEl.textContent =
        `yaw ${r.yaw.toFixed(2)} · pitch ${r.pitch.toFixed(2)} · eyes ${r.eye1.toFixed(2)} / ${r.eye2.toFixed(2)}`;

      ctx.fillStyle = lookingNow ? "#9dff7a" : "#ffcf4a";
      for (const i of [1, 10, 152, 234, 454, 33, 133, 362, 263, 468, 473]) {
        ctx.beginPath();
        ctx.arc(lm[i].x * canvas.width, lm[i].y * canvas.height, i >= 468 ? 5 : 4, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      valuesEl.textContent = "no face detected";
    }

    if (lookingNow) { onCount++; offCount = 0; }
    else            { offCount++; onCount = 0; }

    if (!lookingState && onCount >= FRAMES_TO_ON) {
      lookingState = true;
      send("1");
      updateMusic();
    } else if (lookingState && offCount >= FRAMES_TO_OFF) {
      lookingState = false;
      send("0");
      updateMusic();
    }

    statusEl.textContent = lookingState ? "LOOKING" : "NOT LOOKING";
    statusEl.classList.toggle("on", lookingState);
  }
  requestAnimationFrame(loop);
}

// ---------- soundtrack: plays while NOT looking, stops when a look is detected ----------
const music = document.getElementById("music");
music.volume = 0;
let fadeTimer = null;
function fadeTo(target, done) {
  clearInterval(fadeTimer);
  fadeTimer = setInterval(() => {
    const step = 0.08;
    const v = music.volume;
    if (Math.abs(v - target) <= step) {
      music.volume = target;
      clearInterval(fadeTimer);
      if (done) done();
    } else {
      music.volume = v + (target > v ? step : -step);
    }
  }, 30);
}
function updateMusic() {
  if (lookingState) {
    fadeTo(0, () => music.pause());          // look detected -> stop
  } else {
    music.play().catch(e => say("Music blocked: " + e.message));
    fadeTo(1);                                // not looking -> play
  }
}

// return the servo when the page closes
window.addEventListener("beforeunload", () => send("0"));
</script>
</body>
</html>
